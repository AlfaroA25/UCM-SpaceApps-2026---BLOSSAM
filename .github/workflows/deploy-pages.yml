name: Deploy AstroVital to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "SpaceApps 2026/**"
      - "index.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload AstroVital site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "SpaceApps 2026"
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public app and install assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          page_url="${PAGE_URL%/}"
          index_file="$(mktemp)"
          manifest_file="$(mktemp)"
          worker_file="$(mktemp)"
          trap 'rm -f "$index_file" "$manifest_file" "$worker_file"' EXIT

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$page_url/" -o "$index_file"
          grep -q 'rel="manifest"' "$index_file"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$page_url/manifest.webmanifest" -o "$manifest_file"
          jq -e '.display == "standalone" and .start_url == "./index.html" and (.icons | any(.purpose == "maskable"))' "$manifest_file" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$page_url/sw.js" -o "$worker_file"
          grep -q 'astrovital-shell-' "$worker_file"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$page_url/icons/astrovital-192.png" -o /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$page_url/icons/astrovital-512.png" -o /dev/null
